<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="" />
    <title>Sass-Boilerplate</title>
    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet" />
    <!-- Font answasome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
        integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Css -->
    <link rel="stylesheet" href="./dist/style.css" />
    <!-- My script -->
    <script defer src="./app/js/script.js"></script>
    <!-- Bootstrap css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

</head>

<body>

    <!-- bootstrap scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Header -->
    <header class="cyber-header bg-black text-white">
        <div class="container-fluid h-100">
            <div class="d-flex justify-content-between align-items-center h-100 px-4">

                <div class="header-logo">
                    <a href="#">
                        <img class="img-logo" src="./images/logo.png" alt="Cybersoft Logo">
                    </a>
                </div>

                <div class="header-search ms-auto me-4 d-flex align-items-center">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <span class="search-text">Search</span>
                </div>

                <div class="header-components d-flex align-items-center gap-4">
                    <div class="cart-item">
                        <!-- Current problem is can't change the cart icon since if change with new icon somehow it gone in the nav -->
                        <i class="fa-solid fa-cart-shopping cart-icon"></i>

                        <span class="cart-count">(1)</span>
                    </div>

                    <div class="auth-links">
                        <a href="#" class="login-link">Login</a>
                        <a href="#" class="register-link">Register</a>
                    </div>
                </div>

            </div>
        </div>
    </header>
    <!-- Menu Nav-->
    <section class="menu-nav bg-light">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav nav-underline">
                        <a class="nav-link active " aria-current="page" href="#">Home</a>
                        <a class="nav-link" href="#">Men</a>
                        <a class="nav-link" href="#">Women</a>
                        <a class="nav-link" href="#">Kid</a>
                        <a class="nav-link" href="#">Sport</a>
                    </div>
                </div>
            </div>
        </nav>
    </section>
    <!-- Register section -->
<section class="register-section">
    <div class="container">
        <h2 class="form-title">Register</h2>
        <hr class="mb-5 text-muted opacity-25">

        <form>
            <div class="row gx-5">
                <div class="col-md-6">

                    <div class="mb-2">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="register-input" id="email" placeholder="email">
                        <div class="validation-register" id="email_error"></div>
                    </div>

                    <div class="mb-2">
                        <label for="password" class="form-label">Password</label>
                        <div class="password-wrapper">
                            <input type="password" class="register-input" id="password" placeholder="password">
                            <i class="bi bi-eye-fill"></i>
                        </div>
                        <div class="validation-register" id="password_error"></div>
                    </div>

                    <div class="mb-2">
                        <label for="password_confirm" class="form-label">Password confirm</label>
                        <input type="password" class="register-input" id="password_confirm"
                            placeholder="password confirm">
                        <div class="validation-register" id="password_confirm_error"></div>
                    </div>

                </div>

                <div class="col-md-6">

                    <div class="mb-2">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="register-input" id="name" placeholder="name">
                        <div class="validation-register" id="name_error"></div>
                    </div>

                    <div class="mb-2">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="text" class="register-input" id="phone" placeholder="phone">
                        <div class="validation-register" id="phone_error"></div>
                    </div>

                    <div class="mb-2 d-flex align-items-center mt-3">
                        <label class="form-label me-4 mb-0">Gender</label>

                        <div class="gender-group">
                            <div class="gender-option">
                                <input type="radio" name="gender" id="male" class="gender-radio-input" checked>
                                <label for="male" class="gender-label">
                                    <span class="gender-custom-icon"></span>
                                    <span>Male</span>
                                </label>
                            </div>

                            <div class="gender-option">
                                <input type="radio" name="gender" id="female" class="gender-radio-input">
                                <label for="female" class="gender-label">
                                    <span class="gender-custom-icon"></span>
                                    <span>Femail</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mt-5">
                        <button type="submit" class="btn-purple">SUBMIT</button>
                    </div>

                </div>
            </div>
        </form>
    </div>
</section>

    <!-- Footer -->
    <footer class="text-black text-center ">
        <div class="container">
            <!-- text-start to set all the words to the left ( or the at the start ) -->
            <div class="row text-start">
                <!-- Footer area content 1 -->
                <div class="col-md-4 border-md-end mb-4 mb-md-0 ps-md-5">
                    <h5 class="fw-bold text-uppercase mb-3">Get Help</h5>
                    <ul class="list-unstyled fw-bold">
                        <li class="mb-2"><a href="#" class="text-decoration-none text-dark footer-link">Home</a></li>
                        <li class="mb-2"><a href="#" class="text-decoration-none text-dark footer-link">Nike</a></li>
                        <li class="mb-2"><a href="#" class="text-decoration-none text-dark footer-link">Adidas</a></li>
                        <li class="mb-2"><a href="#" class="text-decoration-none text-dark footer-link">Contact</a></li>
                    </ul>
                </div>

                <!-- Footer area content 2 -->
                <div class="col-md-4 border-md-end mb-4 mb-md-0 ps-md-5">
                    <h5 class="fw-bold text-uppercase mb-3">Support</h5>
                    <ul class="list-unstyled fw-bold ">
                        <li class="mb-2"><a href="#" class="text-decoration-none text-dark footer-link">About</a></li>
                        <li class="mb-2"><a href="#" class="text-decoration-none text-dark footer-link">Contact</a></li>
                        <li class="mb-2"><a href="#" class="text-decoration-none text-dark footer-link">Help</a></li>
                        <li class="mb-2"><a href="#" class="text-decoration-none text-dark footer-link">Phone</a></li>
                    </ul>
                </div>

                <!-- Footer area content 3 -->
                <div class="col-md-4 ps-md-5">
                    <h5 class="fw-bold text-uppercase mb-3">Register</h5>
                    <ul class="list-unstyled fw-bold">
                        <li class="mb-2"><a href="#" class="text-decoration-none text-dark footer-link">register</a>
                        </li>
                        <li class="mb-2"><a href="#" class="text-decoration-none text-dark footer-link">login</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Credit -->
        <section class="credit-Section mt-3">
            <div class="text-center p-3 credit-info">
                <p class="mb-0 text-dark">
                    © 2022 Cybersoft All Rights Reserved | Design Theme by Trương Tấn Khải.
                </p>
            </div>
        </section>
    </footer>

    <!-- boostrap script-->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
